# Vulnapps - proxy to Docker container on 127.0.0.1:8001

server {
        listen 80;
        server_name vulnapps.net;

        # Scan-state uploads (zip of the imported report directory) can run
        # into the low single-digit MB with a large pentest report bundle.
        # nginx's own default (1M) rejects those with a 413 before the
        # request ever reaches the app, even though the app itself accepts
        # up to MAX_STATE_SIZE (100 MB, see app/config.py).
        client_max_body_size 100M;

        location / {
                proxy_pass http://127.0.0.1:8001;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
        }
}
